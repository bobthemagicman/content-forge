# Amplify Hosting build for the production app (research R2). The backend deploys first and writes
# amplify_outputs.json, which the static export imports.
#
# Response headers (CSP, HSTS, ...) and the 404 rewrite aren't set here: Amplify has deprecated
# `customHeaders` in this file, and the CSP names the asset host, which stays out of this public
# repo. scripts/hosting/apply-settings.sh applies both from the same environment variables the
# backend reads (quickstart §2, research R18).
version: 1
backend:
  phases:
    build:
      commands:
        - nvm install 24 && nvm use 24
        - npm ci --cache .npm --prefer-offline
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 24
        # The licensed Aeonik files are git-ignored; the build role reads them from a private prefix.
        - aws s3 cp "$FONTS_S3_URI" src/app/fonts/ --recursive
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: out
    files:
      - "**/*"
  cache:
    paths:
      # npm ci replaces node_modules on every build, so cache npm's download cache instead.
      - .npm/**/*
