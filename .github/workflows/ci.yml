name: CI

on:
  pull_request:
  push:
    branches: [master, "0*-*"]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # The licensed Aeonik files are absent here; prebuild substitutes Lato (T029).
      - run: npm run build
