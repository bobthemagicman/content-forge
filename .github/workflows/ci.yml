name: CI

on:
  pull_request:
  push:
    branches: [master, "0*-*"]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # The licensed Aeonik files are absent here; prebuild substitutes Lato (T029).
      - run: npm run build
      # E2E builds its own export (DEMO_MODE off, mocked backend; see playwright.config.ts).
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
