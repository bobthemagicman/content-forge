name: Claude review

# An advisory AI review of each PR, checked against this repo's own rules. It isn't a required
# check: CI (`checks`) is the merge gate. To keep usage down it reviews when a PR opens or becomes
# ready, not on every push; comment `@claude review again` (claude.yml) to re-review.
#
# Needs the CLAUDE_CODE_OAUTH_TOKEN secret (`claude setup-token`) and the Claude GitHub app.
# Fork PRs get no secrets, so they're skipped.

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The PR branch is checked out in the working directory; use
            `gh pr diff` to see what changed and read the surrounding code as needed.

            Judge it against this repo's own rules first:
            - `.specify/memory/constitution.md`, especially Principle II (server-enforced access and
              asset isolation: only the allowed Workspace domain may read anything), Principle I
              (near-zero cost), and Principle V (tests with every change, including security
              rejection paths);
            - the feature spec in `specs/001-content-forge-mvp/` (spec.md, plan.md, research.md,
              data-model.md, contracts/), and the task the PR says it implements in tasks.md;
            - `AGENTS.md`. This Next.js version differs from older ones; check
              `node_modules/next/dist/docs/` before flagging a Next.js API as wrong.

            Look for, in order of importance:
            1. Security: auth and domain checks, asset access (signed cookies and URLs), IAM scope,
               secrets or the owner's real domain committed to this public repo (placeholders are
               `example.com`), injection, unsafe defaults.
            2. Bugs and behavior that contradicts the spec or contracts.
            3. Missing or weak tests for the changed behavior.
            4. Cost: resources that bill when idle (NAT, VPC, provisioned capacity, unbounded logs).
            5. Accessibility regressions in UI changes (WCAG 2.1 AA).

            Only report problems you can point to in the diff, with a concrete failure scenario.
            Skip style nits that the linter would catch and generic advice. If you're unsure,
            say how confident you are rather than overstating it.

            Post each specific issue as an inline comment with
            `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`), then one
            short summary with `gh pr comment`: the findings ranked by severity, or a plain
            statement that you found nothing blocking. Only post GitHub comments; don't reply
            with review text as a message.
          claude_args: |
            --max-turns 40
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Glob,Grep"
